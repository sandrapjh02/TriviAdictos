<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entretenimiento</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="pagina-rosa">
    <header class="header-preguntas">
        <div class="logo-encabezado-preguntas">
            <img src="./img/Logo.png" alt="Logo Triviadictos">
        </div>
        <h1 class="titulo-historia">ENTRETENIMIENTO</h1>
        <div class="puntaje-tiempo">
            <span class="puntaje">⭐ 0</span>
           
        </div>
        <button class="btn-salir">Salir</button>
    </header>

    <main class="contenedor-pregunta">
        <div class="pregunta-box">
            <h2 id="texto-pregunta">¿Qué actor interpretó a Iron Man en el MCU?</h2>
        </div>

        <div class="opciones">
            <button class="opcion">Chris Evans</button>
            <button class="opcion">Robert Downey Jr.</button>
            <button class="opcion">Chris Hemsworth</button>
            <button class="opcion">Mark Ruffalo</button>
        </div>

        <div class="feedback">
            <p id="mensaje-feedback"></p>
            <button id="siguiente-btn" class="btn-siguiente" disabled>Siguiente</button>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
